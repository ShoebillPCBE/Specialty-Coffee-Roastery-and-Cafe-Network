server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS: resolve upstreams per request so nginx starts even if a backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $server_a     http://command-service:8081;
    set $server_b     http://query-service:8082;
    set $agent_worker http://agent-worker:8091;

    # Server B - read side (cafes, batches, sales projections)
    location /api/v1/query/ {
        proxy_pass $server_b;
    }

    # Agent worker - trigger-now / run history
    location /api/v1/agent/ {
        proxy_pass $agent_worker;
        proxy_read_timeout 180s;
    }

    # Server A - write side (menu, orders, proposals approve/reject)
    location /api/v1/ {
        proxy_pass $server_a;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
